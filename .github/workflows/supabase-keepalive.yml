# Mantiene activa la base de datos de Supabase (plan gratuito).
# Supabase pausa los proyectos gratuitos tras 7 días sin uso;
# esta tarea hace una consulta mínima los lunes y jueves para evitarlo.
name: Mantener Supabase activo

on:
  schedule:
    - cron: "17 12 * * 1,4"   # lunes y jueves 12:17 UTC (09:17 en Uruguay)
  workflow_dispatch:          # permite ejecutarla a mano desde la pestaña Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la tabla de reservas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Faltan los secretos SUPABASE_URL o SUPABASE_KEY en el repositorio."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/reservas?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")
          echo "Respuesta de Supabase: $status"
          if [ "$status" -ge 400 ]; then
            echo "La base no respondió bien. Si el proyecto está pausado, reactivalo desde el panel de Supabase."
            exit 1
          fi